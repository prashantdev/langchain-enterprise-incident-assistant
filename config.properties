# Shared Configuration for Enterprise IT Incident & Service Desk Assistant

# Server Config
server.port=8080
server.host=0.0.0.0

# ChromaDB Vector Store Config
chroma.url=http://localhost:8000
chroma.collection=it_runbooks

# Embedding Model Config
embedding.model.name=AllMiniLmL6V2

# LLM Config - Model 1 (Local Ollama Model)
model1.baseUrl=http://localhost:11434
model1.modelclass=ollama
#model1.modelname=qwen-nothink
model1.modelname=llama3.2:3b
model1.apikey=
model1.timeout=300s

# LLM Config - Model 2 (Frontier Gemini Flash 3.5)
model2.baseUrl=https://generativelanguage.googleapis.com/v1beta/openai/
model2.modelclass=openai
model2.modelname=gemini-3.5-flash
model2.apikey=
model2.timeout=60s

# Security Extension Config
security.pdp.mode=EMBEDDED
security.pdp.opa.url=http://localhost:8181/v1/data/langchain/security/allow
security.pdp.opa.timeout=0.05
security.pdp.circuitbreaker.threshold=1
security.pdp.circuitbreaker.recovery=30.0
security.cache.l1.enabled=true
security.cache.l2.enabled=true
security.cache.l2.ttl=60.0
security.cache.l2.maxEntries=1000
security.ingestion.mode=STRICT_FAIL_CLOSED
security.retry.maxViolations=3
security.abuse.windowSeconds=60.0
security.abuse.maxDenials=3
security.pii.redaction.scope=audit_only

